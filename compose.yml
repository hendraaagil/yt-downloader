services:
  api:
    container_name: yt-dl_api
    build: ./server
    ports: ["4004:4004"]
    volumes:
      - ./data:/data
      - ./downloads:/downloads
      - ./cookies:/cookies   # Netscape cookies *.txt here; writable so yt-dlp can refresh them (see cookies/README)
    environment:
      PORT: "4004"
      DOWNLOAD_DIR: /downloads
      STATE_FILE: /data/state.json
      # optional YouTube cookies (fixes bot gate / 429): rotates across every
      # *.txt in this dir, round-robin per download. empty dir -> no cookies.
      COOKIES_DIR: /cookies
      # downloads older than this many hours are deleted by the periodic sweep
      DOWNLOAD_TTL_HOURS: "12"
      # how often (minutes) the sweep runs
      CLEANUP_INTERVAL_MIN: "60"
    restart: unless-stopped
  web:
    container_name: yt-dl_web
    build: ./web
    ports: ["3003:3003"]
    depends_on: [api]
    restart: unless-stopped
