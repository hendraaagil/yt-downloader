services:
  api:
    container_name: yt-dl_api
    build: ./server
    ports: ["4003:4003"]
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    environment:
      PORT: "4003"
      CONCURRENCY: "2"
      DOWNLOAD_DIR: /downloads
      STATE_FILE: /data/state.json
      # downloads older than this many hours are deleted by the periodic sweep
      DOWNLOAD_TTL_HOURS: "24"
      # how often (minutes) the sweep runs
      CLEANUP_INTERVAL_MIN: "60"
    restart: unless-stopped
  web:
    container_name: yt-dl_web
    build: ./web
    ports: ["3003:3003"]
    depends_on: [api]
    restart: unless-stopped
